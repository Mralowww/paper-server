# PerPlayerKit Language File - Chinese Traditional (繁體中文)
# Uses MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Placeholders use {name} syntax (e.g. {player}, {slot}).
# To use this file, set `language: zh_tw` in config.yml.

prefix: "<gray>[<aqua>套件</aqua>]</gray> "

motd:
  message:
    - ""
    - "<gray>   <st>                </st> <aqua><b>玩家專屬套件</b><gray> <st>                </st>"
    - ""
    - "         <white>輸入 <aqua>/kit<white>、<aqua>/k <white>或 <aqua>/pk<white> 開始使用!"
    - ""
    - "<gray>   <st>                                                         "
    - ""

scheduled-broadcast:
  messages:
    - "<white>使用 <aqua>/pk<white> 命令檢視公共套件!"
    - "<white>想要分享套件? 使用 <aqua>/sharekit \\<slot></aqua><white> 命令。"
    - "<white>輸入 <aqua>/kit<white>、<aqua>/k <white>或 <aqua>/pk<white> 開始使用!"

broadcast-messages:
  player-repaired: "<gray>{player} 修理了裝備</gray>"
  player-healed: "<gray>{player} 治療了自己</gray>"
  player-opened-kit-room: "<gray>{player} 開啟了套件房間</gray>"
  player-loaded-private-kit: "<gray>{player} 載入了一個套件</gray>"
  player-loaded-public-kit: "<gray>{player} 載入了一個公共套件</gray>"
  player-loaded-enderchest: "<gray>{player} 載入了末影箱。</gray>"
  player-copied-kit: "<gray>{player} 複製了一個套件</gray>"
  player-copied-ec: "<gray>{player} 複製了一個末影箱</gray>"
  player-regeared: "<gray>{player} 重新裝備</gray>"
  generic: "<gray><aqua>{player}</aqua> 執行了一個操作。</gray>"

