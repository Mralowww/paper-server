# AdvancedKit - Kit 房間設定檔
#
# 這裡是「無限資源展示櫃」，一般玩家點擊物品即可無限拿取(不會消耗展示櫃庫存)。
# 拿完想要的裝備後，使用 /kit create <名稱> 或 /kit save <名稱> 把目前物品欄存成自己的 Kit。
#
# 管理員請不要手動編輯此檔案！
# 請在遊戲內使用 /kit room edit 進入編輯模式：
#   - 像操作一般箱子一樣自由擺放/替換任何物品(含附魔、藥水效果、自訂名稱等)
#   - 編輯完成後點擊右下角的綠寶石方塊即可儲存並立即套用給所有玩家
#
# 在管理員第一次於遊戲內儲存之前，插件會自動顯示內建的水晶 PVP 風格預設展示櫃。

