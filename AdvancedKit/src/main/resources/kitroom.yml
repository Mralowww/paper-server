# AdvancedKit - Kit 房間設定檔
# 這裡是「無限資源展示櫃」，玩家點擊物品即可無限拿取(不會消耗庫存)。
# 拿完想要的裝備後，使用 /kit create <名稱> 或 /kit save <名稱> 把目前物品欄存成自己的 Kit。
#
# 每個物品設定：
#   slot: 放置的格子編號(0 開始，54 格共 6 排)
#   material: 物品 ID (Bukkit Material 名稱)
#   amount: 左鍵單次拿取數量；Shift+左鍵永遠拿一組(該物品的最大疊加數)
#   name: 顯示名稱，支援 & 色碼
#   lore: 額外說明文字(可省略)
#   custom-model-data: 自訂材質編號(可省略)

