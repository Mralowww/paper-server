name: AdvancedKit
version: '${version}'
main: dev.advancedkit.advancedkit.AdvancedKitPlugin
api-version: '1.21'
folia-supported: true
author: opopjjjidj
description: >
  進階版每人自訂 Kit 系統：支援多套裝備包、GUI 選單、依權限分級的 Kit 數量上限、
  每個 Kit 獨立冷卻時間，以及管理員發放的伺服器共用 Kit（如新手包）。SQLite 儲存資料。

commands:
  kit:
    description: AdvancedKit 主指令
    usage: /kit [room|create|save|delete|give|admin|reload]
    permission: advancedkit.use

permissions:
  advancedkit.use:
    description: 允許使用 /kit 指令建立與領取個人 Kit
    default: true
  advancedkit.kitroom.use:
    description: 允許進入 Kit 房間拿取無限資源裝備
    default: true
  advancedkit.admin:
    description: 允許管理伺服器共用 Kit 與重新載入設定
    default: op
  advancedkit.bypass.cooldown:
    description: 領取 Kit 時不受冷卻時間限制
    default: op
  advancedkit.limit.unlimited:
    description: 個人 Kit 數量不受上限限制
    default: op
