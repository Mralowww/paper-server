<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080c">
<link rel="icon" href="/assets/cube.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=8">
<script src="/assets/i18n.js?v=8" defer></script>
<script src="/assets/main.js?v=8" defer></script>
<script src="/assets/ui.js?v=8" defer></script>
<title>Rankings · Mc.Tierlist.Asia</title>
</head>
<body data-page="rankings">
<main class="container" style="padding-top:36px">
  <div class="section-head reveal">
    <div><div class="kicker">Leaderboard</div><h2 data-i18n="rank.title"></h2></div>
    <span id="boardCount" class="link-more"></span>
  </div>
  <div class="board-shell reveal" style="--d:.06s">
    <div class="mode-tabs">
      <button class="mode-tab active"><img src="/assets/vanilla.svg" alt="">Vanilla</button>
    </div>
    <div class="filters">
      <div class="select-wrap">
        <select id="tierSelect" aria-label="Tier">
          <option value="" data-i18n="rank.allTiers"></option>
          <option value="1">Tier 1</option><option value="2">Tier 2</option><option value="3">Tier 3</option>
          <option value="4">Tier 4</option><option value="5">Tier 5</option>
        </select>
      </div>
      <label class="search-inline"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="boardSearch" data-i18n-ph="rank.filter" autocomplete="off"></label>
    </div>
    <div class="board-head"><span>#</span><span data-i18n="rank.player"></span><span data-i18n="rank.region"></span><span style="text-align:right">Tier</span></div>
    <div id="board"></div>
    <div class="board-more"><button class="btn" id="loadMore" hidden data-i18n="rank.loadMore"></button></div>
  </div>
</main>
</body>
</html>
