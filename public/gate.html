<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080c">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/cube.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=19">
<!--GATE-->
<script src="/assets/i18n.js?v=19" defer></script>
<script src="/assets/gate.js?v=19" defer></script>
<script src="/assets/ctxmenu.js?v=19" defer></script>
<title>Mc.Tierlist.Asia</title>
</head>
<body class="gate-body">
<div class="gate-bg" aria-hidden="true"><i></i><i></i></div>
<main class="gate" id="gate">
  <img class="gate-cube" src="/assets/cube.svg" alt="">
  <div class="eyebrow gate-eyebrow"><span class="pulse"></span><span id="gEyebrow"></span></div>
  <h1 class="gate-title" id="gTitle"></h1>
  <p class="gate-lead" id="gLead"></p>
  <div class="gate-clock" id="gClock" hidden>
    <div class="gate-unit"><b data-u="d">00</b><span data-i18n="gate.days"></span></div>
    <div class="gate-unit"><b data-u="h">00</b><span data-i18n="gate.hours"></span></div>
    <div class="gate-unit"><b data-u="m">00</b><span data-i18n="gate.minutes"></span></div>
    <div class="gate-unit"><b data-u="s">00</b><span data-i18n="gate.seconds"></span></div>
  </div>
  <p class="gate-when" id="gWhen"></p>
  <div class="gate-actions">
    <a class="btn btn-gold" href="/discord" target="_blank" rel="noopener" data-i18n="gate.discord"></a>
  </div>
  <div class="gate-foot">
    <span class="gate-langs" id="gLangs"></span>
    <a id="gStaff" data-i18n="gate.staff"></a>
  </div>
</main>
</body>
</html>
