<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080c">
<link rel="icon" href="/assets/cube.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Press+Start+2P&family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css?v=21">
<script src="/assets/i18n.js?v=21" defer></script>
<script src="/assets/main.js?v=21" defer></script>
<script src="/assets/ui.js?v=21" defer></script>
<script src="/assets/ctxmenu.js?v=21" defer></script>
<script src="/assets/sound.js?v=21" defer></script>
<title>Mc.Tierlist.Asia · Minecraft Vanilla PvP Tier List</title>
<meta name="description" content="華人原版水晶 V2 · Minecraft Vanilla PvP Tier 排行榜">
</head>
<body data-page="home">
<main>
  <section class="hero-lite">
    <div class="container">
      <div class="hero-lite-inner reveal">
        <h1 data-i18n-html="hero.title"></h1>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="hero-actions">
          <a class="btn btn-gold" href="/rankings"><span data-i18n="hero.cta"></span> <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a class="btn" href="/docs" data-i18n="nav.docs"></a>
        </div>
        <button class="server-card" data-copy-ip>
          <span class="server-dot"></span>
          <span class="server-text"><span class="muted" data-i18n="server.label"></span><b>Mc.Tierlist.Asia</b></span>
          <span class="server-copy" data-i18n="server.copyHint"></span>
        </button>
      </div>

      <div class="stats">
        <div class="stat spot reveal" style="--d:.05s"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 3.5a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg></div><div class="num" data-stat="players">0</div><div class="lbl" data-i18n="stat.players"></div></div>
        <div class="stat spot reveal" style="--d:.1s"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg></div><div class="num" data-stat="tier1">0</div><div class="lbl" data-i18n="stat.tier1"></div></div>
        <div class="stat spot reveal" style="--d:.15s"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="15" r="6"/><path d="M8.5 10 6 3h4l2 4 2-4h4l-2.5 7"/></svg></div><div class="num" data-stat="tier2">0</div><div class="lbl" data-i18n="stat.tier2"></div></div>
        <div class="stat spot reveal" style="--d:.2s"><div class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></div><div class="num" data-stat="tests">0</div><div class="lbl" data-i18n="stat.tests"></div></div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="container">
      <div class="section-head reveal">
        <div><div class="kicker">Top Players</div><h2 data-i18n="home.topTitle"></h2></div>
        <a class="link-more" href="/rankings" data-i18n="home.fullBoard"></a>
      </div>
      <div class="board-shell reveal"><div id="topList"></div></div>
    </div>
  </section>

  <section class="block">
    <div class="container">
      <div class="section-head reveal"><div><div class="kicker">Tier System</div><h2 data-i18n="home.tierTitle"></h2></div></div>
      <div class="tier-ladder">
        <div class="tier-col spot reveal" style="--d:0s"><h3><span class="dot" style="background:var(--gold-grad)"></span>Tier 1</h3><div class="row"><span class="tier t1">HT1</span><span>60 pts</span></div><div class="row"><span class="tier t1 lt">LT1</span><span>45 pts</span></div></div>
        <div class="tier-col spot reveal" style="--d:.06s"><h3><span class="dot" style="background:var(--silver-grad)"></span>Tier 2</h3><div class="row"><span class="tier t2">HT2</span><span>30 pts</span></div><div class="row"><span class="tier t2 lt">LT2</span><span>20 pts</span></div></div>
        <div class="tier-col spot reveal" style="--d:.12s"><h3><span class="dot" style="background:var(--bronze-grad)"></span>Tier 3</h3><div class="row"><span class="tier t3">HT3</span><span>10 pts</span></div><div class="row"><span class="tier t3 lt">LT3</span><span>6 pts</span></div></div>
        <div class="tier-col spot reveal" style="--d:.18s"><h3><span class="dot" style="background:#323b52"></span>Tier 4</h3><div class="row"><span class="tier t4">HT4</span><span>4 pts</span></div><div class="row"><span class="tier t4 lt">LT4</span><span>3 pts</span></div></div>
        <div class="tier-col spot reveal" style="--d:.24s"><h3><span class="dot" style="background:#262c3a"></span>Tier 5</h3><div class="row"><span class="tier t5">HT5</span><span>2 pts</span></div><div class="row"><span class="tier t5 lt">LT5</span><span>1 pts</span></div></div>
      </div>
      <p class="reveal" style="color:var(--muted);font-size:14px;margin-top:14px" data-i18n="home.tierNote"></p>
    </div>
  </section>

</main>
</body>
</html>
