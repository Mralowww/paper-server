<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft 伺服器狀態查詢</title>
<style>
  :root {
    --bg: #1e2129;
    --card: #2a2e38;
    --accent: #5cb85c;
    --accent-off: #d9534f;
    --text: #e8e8e8;
    --muted: #9aa0ab;
    --border: #3a3f4b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e2129 0%, #262b36 100%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    padding: 32px 16px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  .sub {
    text-align: center;
    color: var(--muted);
    margin-bottom: 28px;
    font-size: 0.9rem;
  }
  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #10130f;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: none;
  }
  .card.show { display: block; }
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }
  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-off);
    flex-shrink: 0;
  }
  .dot.online { background: var(--accent); }
  .status-text { font-weight: 600; font-size: 1.1rem; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; }
  }
  .field { font-size: 0.85rem; }
  .field .label { color: var(--muted); margin-bottom: 2px; }
  .field .value { font-weight: 500; word-break: break-word; }
  .motd {
    background: #14161c;
    border-radius: 8px;
    padding: 12px 14px;
    font-family: "Courier New", monospace;
    white-space: pre-wrap;
    font-size: 0.9rem;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .players-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .player-chip {
    background: #14161c;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 0.85rem;
  }
  .msg {
    text-align: center;
    color: var(--muted);
    padding: 20px 0;
  }
  .msg.error { color: var(--accent-off); }
  .icon {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    margin-right: 4px;
    image-rendering: pixelated;
  }
  .type-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .type-btn {
    flex: 1;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--muted);
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
  }
  .type-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(92, 184, 92, 0.1);
  }
  .history-wrap {
    margin-bottom: 24px;
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .history-header .label {
    color: var(--muted);
    font-size: 0.85rem;
  }
  .clear-history {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 0.8rem;
    padding: 2px 6px;
    text-decoration: underline;
    cursor: pointer;
  }
  .clear-history:hover { color: var(--accent-off); opacity: 1; }
  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .history-chip {
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 10px 5px 12px;
    font-size: 0.82rem;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .history-chip:hover { border-color: var(--accent); }
  .history-chip .tag {
    font-size: 0.7rem;
    color: var(--muted);
    background: #14161c;
    border-radius: 4px;
    padding: 1px 5px;
  }
  .history-chip .remove {
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1;
    padding: 0 2px;
  }
  .history-chip .remove:hover { color: var(--accent-off); }
</style>
</head>
<body>
<div class="wrap">
  <h1>⛏️ Minecraft 伺服器狀態查詢</h1>
  <p class="sub">輸入伺服器位址（例如 mc.hypixel.net）查詢即時狀態</p>

  <div class="type-toggle">
    <button type="button" class="type-btn active" data-type="java">Java 版</button>
    <button type="button" class="type-btn" data-type="bedrock">Bedrock 版</button>
  </div>

  <div class="search-box">
    <input type="text" id="serverInput" placeholder="輸入伺服器位址..." autocomplete="off">
    <button id="queryBtn">查詢</button>
  </div>

  <div class="history-wrap" id="historyWrap" style="display: none;">
    <div class="history-header">
      <span class="label">最近查詢</span>
      <button class="clear-history" id="clearHistoryBtn">清除全部</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <div id="message" class="msg"></div>
  <div id="card" class="card"></div>
</div>

<script>
  const input = document.getElementById('serverInput');
  const btn = document.getElementById('queryBtn');
  const card = document.getElementById('card');
  const message = document.getElementById('message');
  const typeBtns = document.querySelectorAll('.type-btn');
  const historyWrap = document.getElementById('historyWrap');
  const historyList = document.getElementById('historyList');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');

  const HISTORY_KEY = 'mc-status-history';
  const HISTORY_MAX = 8;
  let serverType = 'java'; // 'java' | 'bedrock'

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  // ---- 查詢歷史 (localStorage) ----
  function loadHistory() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveHistory(list) {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
    } catch (e) {
      // localStorage 不可用時靜默略過
    }
  }

  function addToHistory(address, type) {
    let list = loadHistory();
    list = list.filter(item => !(item.address === address && item.type === type));
    list.unshift({ address, type });
    if (list.length > HISTORY_MAX) list = list.slice(0, HISTORY_MAX);
    saveHistory(list);
    renderHistory();
  }

  function removeFromHistory(address, type) {
    let list = loadHistory().filter(item => !(item.address === address && item.type === type));
    saveHistory(list);
    renderHistory();
  }

  function renderHistory() {
    const list = loadHistory();
    if (!list.length) {
      historyWrap.style.display = 'none';
      return;
    }
    historyWrap.style.display = 'block';
    historyList.innerHTML = list.map(item => `
      <span class="history-chip" data-address="${escapeHtml(item.address)}" data-type="${item.type}">
        <span class="tag">${item.type === 'bedrock' ? 'BE' : 'JE'}</span>
        <span class="addr">${escapeHtml(item.address)}</span>
        <span class="remove" data-remove="${escapeHtml(item.address)}" data-remove-type="${item.type}">✕</span>
      </span>
    `).join('');
  }

  historyList.addEventListener('click', (e) => {
    const removeTarget = e.target.closest('.remove');
    if (removeTarget) {
      e.stopPropagation();
      removeFromHistory(removeTarget.dataset.remove, removeTarget.dataset.removeType);
      return;
    }
    const chip = e.target.closest('.history-chip');
    if (chip) {
      input.value = chip.dataset.address;
      setServerType(chip.dataset.type);
      queryServer();
    }
  });

  clearHistoryBtn.addEventListener('click', () => {
    saveHistory([]);
    renderHistory();
  });

  // ---- Java / Bedrock 切換 ----
  function setServerType(type) {
    serverType = type;
    typeBtns.forEach(b => b.classList.toggle('active', b.dataset.type === type));
  }

  typeBtns.forEach(b => {
    b.addEventListener('click', () => setServerType(b.dataset.type));
  });

  async function queryServer() {
    const address = input.value.trim();
    if (!address) {
      message.textContent = '請輸入伺服器位址';
      message.className = 'msg error';
      card.classList.remove('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = '查詢中...';
    message.textContent = '';
    message.className = 'msg';
    card.classList.remove('show');

    try {
      const apiPath = serverType === 'bedrock'
        ? `https://api.mcsrvstat.us/bedrock/3/${encodeURIComponent(address)}`
        : `https://api.mcsrvstat.us/3/${encodeURIComponent(address)}`;
      const res = await fetch(apiPath);
      if (!res.ok) throw new Error('查詢失敗');
      const data = await res.json();

      addToHistory(address, serverType);

      if (!data.online) {
        card.innerHTML = `
          <div class="status-row">
            <div class="dot"></div>
            <div class="status-text">離線 / 無法連線</div>
          </div>
          <p style="color: var(--muted); margin: 0;">找不到 <strong>${escapeHtml(address)}</strong> 的伺服器，或伺服器目前離線。</p>
        `;
        card.classList.add('show');
        return;
      }

      const iconHtml = data.icon
        ? `<img class="icon" src="${data.icon}" alt="server icon">`
        : '';

      const motdHtml = data.motd && data.motd.clean
        ? `<div class="motd">${escapeHtml(data.motd.clean.join('\n'))}</div>`
        : '';

      const playersOnline = data.players ? data.players.online : 0;
      const playersMax = data.players ? data.players.max : '?';

      let playerListHtml = '';
      if (data.players && data.players.list && data.players.list.length) {
        playerListHtml = `
          <div class="field" style="margin-bottom: 6px;">
            <div class="label">線上玩家</div>
          </div>
          <div class="players-list">
            ${data.players.list.map(p => `<span class="player-chip">${escapeHtml(p)}</span>`).join('')}
          </div>
        `;
      }

      card.innerHTML = `
        <div class="status-row">
          ${iconHtml}
          <div class="dot online"></div>
          <div class="status-text">線上</div>
        </div>
        ${motdHtml}
        <div class="grid">
          <div class="field">
            <div class="label">玩家人數</div>
            <div class="value">${playersOnline} / ${playersMax}</div>
          </div>
          <div class="field">
            <div class="label">版本</div>
            <div class="value">${escapeHtml(data.version || '未知')}</div>
          </div>
          <div class="field">
            <div class="label">IP</div>
            <div class="value">${escapeHtml(data.ip || '未知')}</div>
          </div>
          <div class="field">
            <div class="label">Port</div>
            <div class="value">${escapeHtml(String(data.port || '未知'))}</div>
          </div>
        </div>
        ${playerListHtml}
      `;
      card.classList.add('show');
    } catch (err) {
      message.textContent = '查詢時發生錯誤，請稍後再試。';
      message.className = 'msg error';
    } finally {
      btn.disabled = false;
      btn.textContent = '查詢';
    }
  }

  btn.addEventListener('click', queryServer);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') queryServer();
  });

  renderHistory();
</script>
</body>
</html>
