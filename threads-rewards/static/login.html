<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入 · 鋸齒 SMP</title>
<meta name="description" content="鋸齒 SMP 官方網站 — Minecraft 生存伺服器 sawsmp.me">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tr.theme")||'"dark"');if(JSON.parse(localStorage.getItem("tr.motion")||"false"))document.documentElement.dataset.motion="reduce"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="theme-color" content="#0c0f11">
<link rel="icon" type="image/png" sizes="64x64" href="/static/img/icon-64.png">
<link rel="apple-touch-icon" href="/static/img/icon-256.png">
<meta property="og:image" content="https://www.sawsmp.me/static/img/icon-512.png">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="topbar"></div>
<header id="nav"></header>
<main class="page">
  <div class="container login-wrap">
    <div class="float-orb" style="width:300px;height:300px;left:10%;top:15%;background:#f5c542"></div>
    <div class="float-orb" style="width:240px;height:240px;right:10%;bottom:10%;background:#5865f2;animation-delay:-6s"></div>
    <div class="card login-card reveal-s">
      <div class="brand-logo"><img src="/static/img/icon-256.png" alt="鋸齒 SMP"></div>
      <h2 data-i18n="login.title"></h2>
      <p class="muted" data-i18n="login.sub"></p>
      <div id="login-error"></div>
      <div class="perks">
        <div><span data-px="heart"></span><span data-i18n="login.perk1"></span></div>
        <div><span data-px="trophy"></span><span data-i18n="login.perk2"></span></div>
        <div><span data-px="reply"></span><span data-i18n="login.perk3"></span></div>
      </div>
      <a class="btn btn-discord lg" style="width:100%" href="/auth/login" id="login-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2.1a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.2-.8-9.7-3.6-13.7ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.6 8 10.6s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>
        <span data-i18n="login.btn"></span>
      </a>
      <p class="dim" style="font-size:12px;margin:16px 0 0" data-i18n="login.note"></p>
    </div>
  </div>
</main>
<footer id="footer"></footer>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/art.js"></script>
<script src="/static/js/core.js"></script>
<script src="/static/js/fx.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
