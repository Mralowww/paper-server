<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鋸齒 SMP · 官方網站</title>
<meta name="description" content="鋸齒 SMP 官方網站 — Minecraft 生存伺服器，伺服器位址 sawsmp.me">
<meta property="og:title" content="鋸齒 SMP · 官方網站">
<meta property="og:description" content="鋸齒 SMP 官方網站 — Minecraft 生存伺服器，伺服器位址 sawsmp.me">
<meta property="og:site_name" content="鋸齒 SMP">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tr.theme")||'"dark"');if(JSON.parse(localStorage.getItem("tr.motion")||"false"))document.documentElement.dataset.motion="reduce"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="theme-color" content="#0c0f11">
<link rel="icon" type="image/png" sizes="64x64" href="/static/img/icon-64.png">
<link rel="apple-touch-icon" href="/static/img/icon-256.png">
<meta property="og:image" content="https://www.sawsmp.me/static/img/icon-512.png">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="topbar"></div>
<header id="nav"></header>
<main class="page">
  <div class="container">
    <section class="hero-v2">
      <div>
        <span class="eyebrow row" style="gap:10px;margin-bottom:22px"><span class="tag live" id="status-tag"><span data-i18n="home.checking"></span></span><span class="eyebrow-text" data-i18n="home.hero.eyebrow"></span></span>
        <h1 data-i18n-html="home.hero.title"></h1>
        <p class="lead" data-i18n="home.hero.lead"></p>
        <div class="ip-box">
          <div class="ip"><small data-i18n="home.ip"></small><b id="ip" class="typed"></b></div>
          <button type="button" id="copy-ip" data-i18n="home.copyIp"></button>
        </div>
        <div class="row" style="margin-top:16px">
          <a class="btn lg" href="/rankings" data-i18n="nav.rankings"></a>
          <a class="btn lg ghost" href="/rules" data-i18n="home.readRules"></a>
        </div>
        <div class="status-line" id="status-line">
          <span><i class="dot" id="st-dot"></i><span id="st-text" data-i18n="home.checking"></span></span>
          <span id="st-players" hidden></span>
          <span id="st-version" class="mono" hidden></span>
        </div>
      </div>
      <div class="hero-stage" id="stage" data-parallax="0.04">
        <canvas id="stage-canvas"></canvas>
        <div class="stage-cap"><span class="stage-status"><i class="pulse-dot" id="stage-dot"></i><span id="stage-text">SAWSMP.ME</span></span><span id="stage-season">SEASON 1</span></div>
      </div>
      <div class="scroll-hint"><i></i>SCROLL</div>
    </section>
    <div class="marquee"><div id="marquee"></div></div>

    <section class="section">
      <div class="section-head reveal"><div><span class="eyebrow-text">01</span><h2 data-i18n="home.features"></h2><p class="muted" data-i18n="home.featuresSub"></p></div></div>
      <div class="grid grid-3">
        <div class="card hover feature reveal"><span class="num-badge icon-spin" data-px="star"></span><h3 data-i18n="home.f1.t"></h3><p data-i18n="home.f1.d"></p></div>
        <div class="card hover feature reveal"><span class="num-badge icon-spin" data-px="chart"></span><h3 data-i18n="home.f2.t"></h3><p data-i18n="home.f2.d"></p></div>
        <div class="card hover feature reveal"><span class="num-badge icon-spin" data-px="user"></span><h3 data-i18n="home.f3.t"></h3><p data-i18n="home.f3.d"></p></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head reveal"><div><span class="eyebrow-text">02</span><h2 data-i18n="home.latest"></h2></div><a href="/news" class="btn sm" data-i18n="home.allNews"></a></div>
      <div class="grid grid-3" id="latest">
        <div class="card skeleton" style="height:170px"></div><div class="card skeleton" style="height:170px"></div><div class="card skeleton" style="height:170px"></div>
      </div>
    </section>

    <section class="section split" id="join">
      <div class="card reveal">
        <span class="eyebrow-text">03</span>
        <h2 data-i18n="home.join.title"></h2>
        <p class="muted" data-i18n="home.join.sub" style="margin-top:0"></p>
        <div class="stack steps" style="margin-top:22px">
          <div class="step"><div><b data-i18n="home.join.1"></b><p data-i18n="home.join.1d"></p></div></div>
          <div class="step"><div><b data-i18n="home.join.2"></b><p data-i18n="home.join.2d"></p></div></div>
          <div class="step"><div><b data-i18n="home.join.3"></b><p data-i18n="home.join.3d"></p></div></div>
        </div>
      </div>
      <a class="card hover reveal-l" href="/rewards" style="display:block">
        <span class="eyebrow-text">04</span>
        <h2 style="font-size:30px" data-i18n="home.rewardsPromo"></h2>
        <p class="muted" data-i18n="home.rewardsPromoD"></p>
        <div class="board" id="mini-board" style="margin:14px 0"></div>
        <span class="gold-text" style="font-weight:500" data-i18n="home.rewardsGo"></span>
      </a>
    </section>
  </div>
</main>
<footer id="footer"></footer>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/art.js"></script>
<script src="/static/js/core.js"></script>
<script src="/static/js/fx.js"></script>
<script src="/static/js/site.js"></script>
</body>
</html>
