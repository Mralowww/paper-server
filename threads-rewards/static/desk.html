<body class="standalone">
<div id="topbar"></div>
<div class="desk">

    <a class="desk-back" href="/admin#tickets" title="Admin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <div class="desk-brand"><img src="/static/img/icon-128.png" alt=""><div><b data-i18n="dk.title"></b><small data-i18n="dk.sub"></small></div></div>
    <div class="desk-stats" id="dk-stats"></div>
    <div class="desk-tools">
      <div class="dk-lays" role="group">
        <button class="dk-lay" data-lay="side" title="Alt+1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>

        <button class="dk-lay" data-lay="bottom" title="Alt+3"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 14h18"/></svg></button>
      </div>
      <button class="btn sm" id="dk-logs"></button>

  <div class="desk-body">

      <div class="desk-filters" id="dk-f"></div>
      <div class="desk-items" id="dk-items"><div class="skeleton sk-row"></div><div class="skeleton sk-row"></div></div>
      <div class="desk-hint" data-i18n="dk.hint"></div>
