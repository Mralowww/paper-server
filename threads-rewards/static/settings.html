<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定 · 鋸齒 SMP</title>
<meta name="description" content="鋸齒 SMP 官方網站 — Minecraft 生存伺服器 sawsmp.me">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem("tr.theme")||'"dark"');if(JSON.parse(localStorage.getItem("tr.motion")||"false"))document.documentElement.dataset.motion="reduce"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="theme-color" content="#0c0f11">
<link rel="icon" type="image/png" sizes="64x64" href="/static/img/icon-64.png">
<link rel="apple-touch-icon" href="/static/img/icon-256.png">
<meta property="og:image" content="https://www.sawsmp.me/static/img/icon-512.png">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div id="topbar"></div>
<header id="nav"></header>
<main class="page">
  <div class="container" style="max-width:760px">
    <div class="section-head reveal"><div><span class="eyebrow-text">Settings</span><h2 data-i18n="set.title"></h2><p class="muted" data-i18n="set.sub"></p></div></div>
    <div class="card reveal">
      <div class="card-title"><h3 data-i18n="snd.title"></h3></div>
      <div class="setting-row snd-master" id="snd-master">
        <div class="txt"><b data-i18n="set.sound"></b><small data-i18n="set.soundd"></small></div>
        <label class="switch"><input type="checkbox" id="sound"><span></span></label>
      </div>
      <div class="setting-row">
        <div class="txt"><b data-i18n="snd.master"></b><small class="mono" id="vol-label"></small></div>
        <input type="range" id="volume" min="0" max="100" step="1" style="max-width:220px">
      </div>
      <div id="snd-cats"></div>
    </div>
    <div class="card reveal section">
      <div class="setting-row">
        <div class="txt"><b data-i18n="set.theme"></b></div>
        <select class="enhance" id="theme"><option value="dark" data-i18n="set.dark"></option><option value="light" data-i18n="set.light"></option></select>
      </div>
      <div class="setting-row">
        <div class="txt"><b data-i18n="set.lang"></b></div>
        <select class="enhance" id="lang"><option value="zh">中文</option><option value="en">English</option></select>
      </div>
      <div class="setting-row">
        <div class="txt"><b data-i18n="set.motion"></b><small data-i18n="set.motiond"></small></div>
        <label class="switch"><input type="checkbox" id="motion"><span></span></label>
      </div>
    </div>
    <div class="card reveal section" id="nt-card">
      <div class="card-title"><h3 data-i18n="nt.title"></h3><span class="nt-state" id="nt-state"></span></div>
      <p class="muted" style="margin:0 0 6px" data-i18n="nt.desc"></p>
      <div class="setting-row">
        <div class="txt"><b data-i18n="nt.enable"></b><small data-i18n="nt.enabled"></small></div>
        <label class="switch"><input type="checkbox" id="nt-on" data-snd-cat="x"><span></span></label>
      </div>
      <div class="setting-row" id="nt-k-tickets" hidden>
        <div class="txt"><b data-i18n="nt.k.tickets"></b><small data-i18n="nt.k.ticketsd"></small></div>
        <label class="switch"><input type="checkbox" data-kind="tickets" data-snd-cat="x"><span></span></label>
      </div>
      <div class="setting-row">
        <div class="txt"><b data-i18n="nt.k.replies"></b><small data-i18n="nt.k.repliesd"></small></div>
        <label class="switch"><input type="checkbox" data-kind="replies" data-snd-cat="x"><span></span></label>
      </div>
      <div class="setting-row"><div class="txt"><small class="dim" id="nt-help"></small></div><button class="btn sm" id="nt-test" data-i18n="nt.test"></button></div>
    </div>
    <div class="card reveal section">
      <div class="card-title"><h3 data-i18n="set.shortcuts"></h3></div>
      <div class="setting-row"><div class="txt" data-i18n="sc.search"></div><span class="kbd">Ctrl K</span></div>
      <div class="setting-row"><div class="txt" data-i18n="sc.submit"></div><span class="kbd">Ctrl Enter</span></div>
      <div class="setting-row"><div class="txt" data-i18n="sc.close"></div><span class="kbd">Esc</span></div>
    </div>
  </div>
</main>
<footer id="footer"></footer>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/art.js"></script>
<script src="/static/js/core.js"></script>
<script src="/static/js/fx.js"></script>
<script src="/static/js/notify.js"></script>
<script src="/static/js/settings.js"></script>
</body>
</html>
